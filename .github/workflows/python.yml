name: Python tests and packaging

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,build]'
      - run: python -m pytest -q
      - run: python -m build
      - name: Check installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/litmetica3d-wheel"
          if [ "$RUNNER_OS" = Windows ]; then
            wheel_python="$RUNNER_TEMP/litmetica3d-wheel/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/litmetica3d-wheel/bin/python"
          fi
          "$wheel_python" -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_python" -c 'from importlib.resources import files; import litmetica3d; assert files("litmetica3d").joinpath("mc_assets/26.2/assets/minecraft/blockstates/stone.json").is_file(); print(litmetica3d.__version__)'
          "$wheel_python" -m litmetica3d --version
